<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wobble heads — cars</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #87a0b8; color: #f5f5f7; font-family: system-ui, -apple-system, sans-serif; }
    #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; top: 16px; left: 16px; width: 312px; z-index: 2;
      background: rgba(16, 17, 21, 0.86); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(14px);
    }
    .hud h1 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
    .hud p { margin: 0 0 10px; color: #a1a1aa; font-size: 12px; line-height: 1.45; }
    label { display: flex; justify-content: space-between; font-size: 11px; color: #d4d4d8; margin-top: 8px; }
    label span { color: #a1a1aa; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; margin: 3px 0 0; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row button {
      flex: 1; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer;
      background: #3b82f6; color: white; font-weight: 600; font-size: 12px;
    }
    .row button.ghost { background: #27272a; }
    #state { margin-top: 10px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4ade80; }
    #state.trip { color: #fb7185; }
    #state.air { color: #fbbf24; }
    #state.drive { color: #93c5fd; }
    #prompt {
      position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
      z-index: 2; color: #fff; font-size: 14px; font-weight: 650;
      background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 999px;
      pointer-events: none; display: none; white-space: nowrap;
    }
    .hint {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 1; color: #d4d4d8; font-size: 12px; background: rgba(0,0,0,0.5);
      padding: 6px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    }
    #load {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 3;
      background: #87a0b8; font-size: 14px; color: #1f2933; text-align: center; padding: 24px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="load">Loading people and cars…</div>
  <canvas id="c"></canvas>
  <div id="prompt">Press E to get in</div>
  <div class="hud">
    <h1>Wobble heads + cars</h1>
    <p>Walk up to a car and press <b style="color:#fff">E</b> to sit down like a person, then drive. E again to climb out. Heads only nudge while walking.</p>
    <label>Head mass <span id="massV">2.8</span></label>
    <input id="mass" type="range" min="0.4" max="9" step="0.1" value="2.8">
    <label>Walk nudges / sec <span id="hzV">1.6</span></label>
    <input id="hz" type="range" min="1" max="4" step="0.1" value="1.6">
    <label>Nudge amount <span id="ampV">2.4</span></label>
    <input id="amp" type="range" min="1" max="5" step="0.1" value="2.4">
    <label>Head size <span id="sizeV">2.1</span></label>
    <input id="size" type="range" min="1" max="3.4" step="0.05" value="2.1">
    <div class="row">
      <button id="reset" class="ghost" type="button">Reset you</button>
    </div>
    <div id="state">Idle</div>
  </div>
  <div class="hint">WASD walk / drive · E get in or out · Space jump · drag look</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

    const CDN = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf';
    const URLS = {
      rpm: CDN + '/readyplayer.me.glb',
      michelle: CDN + '/Michelle.glb',
      soldier: CDN + '/Soldier.glb',
      ferrari: CDN + '/ferrari.glb',
    };
    const FACE_OFFSET = -Math.PI / 2;
    const TURN_SPEED = 2.8;
    const WALK_SPEED = 1.35;
    const FLOOR_Y = 0;
    const CAM_HEIGHT = 5.8;
    const CAM_BACK = 9.4;
    const CAM_LOOK = 1.05;
    const CAM_MIN_Y = 4.4;
    const CAM_HEIGHT_MIN = 4.4;
    const CAM_HEIGHT_MAX = 9.5;
    const CAM_BACK_MIN = 6.5;
    const CAM_BACK_MAX = 16;
    const ENTER_TIME = 2.35;
    const EXIT_TIME = 2.15;
    const DOOR_ANGLE = 1.15;
    const SIT_DROP = 0.5;

    const canvas = document.getElementById('c');
    const loadEl = document.getElementById('load');
    const stateEl = document.getElementById('state');
    const promptEl = document.getElementById('prompt');
    const sliders = {
      mass: document.getElementById('mass'),
      hz: document.getElementById('hz'),
      amp: document.getElementById('amp'),
      size: document.getElementById('size'),
    };
    for (const [id, el] of Object.entries(sliders)) {
      const label = { mass: 'massV', hz: 'hzV', amp: 'ampV', size: 'sizeV' }[id];
      el.addEventListener('input', () => { document.getElementById(label).textContent = el.value; });
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87a0b8');
    scene.fog = new THREE.Fog('#87a0b8', 32, 120);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(50, 1, 0.4, 250);
    const cam = { yaw: 0, height: CAM_HEIGHT, back: CAM_BACK };
    camera.up.set(0, 1, 0);
    camera.position.set(0, CAM_HEIGHT, CAM_BACK);

    scene.add(new THREE.HemisphereLight('#e8eefc', '#3a2a1c', 0.75));
    const sun = new THREE.DirectionalLight('#fff3df', 2.2);
    sun.position.set(8, 14, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.00025;
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(400, 16, 400),
      new THREE.MeshStandardMaterial({ color: '#5c6573', roughness: 0.98, metalness: 0 })
    );
    ground.position.y = -8;
    ground.receiveShadow = true;
    scene.add(ground);
    const asphalt = new THREE.Mesh(
      new THREE.CircleGeometry(22, 64),
      new THREE.MeshStandardMaterial({ color: '#3a404c', roughness: 0.9 })
    );
    asphalt.rotation.x = -Math.PI / 2;
    asphalt.position.y = 0.01;
    asphalt.receiveShadow = true;
    scene.add(asphalt);
    const grid = new THREE.GridHelper(40, 40, '#8b93a1', '#6a7382');
    grid.position.y = 0.02;
    scene.add(grid);

    const lookAtPt = new THREE.Vector3();
    function followTarget(px, py, pz, heading, driving) {
      cam.height = THREE.MathUtils.clamp(cam.height, CAM_HEIGHT_MIN, CAM_HEIGHT_MAX);
      cam.back = THREE.MathUtils.clamp(cam.back, CAM_BACK_MIN, CAM_BACK_MAX);
      const back = driving ? cam.back + 2.2 : cam.back;
      const height = driving ? Math.max(cam.height, 6.2) : cam.height;
      const yaw = driving ? heading : cam.yaw;
      camera.position.set(
        px - Math.sin(yaw) * back,
        Math.max(CAM_MIN_Y, py + height),
        pz - Math.cos(yaw) * back
      );
      camera.up.set(0, 1, 0);
      lookAtPt.set(px, py + (driving ? 1.35 : CAM_LOOK), pz);
      camera.lookAt(lookAtPt);
    }

    const keys = {};
    addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if ((e.code === 'KeyE' || e.code === 'KeyF') && !e.repeat && player) tryEnterExit(player);
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });
    canvas.tabIndex = 0;
    let dragging = false;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      canvas.focus();
    });
    canvas.addEventListener('pointerup', (e) => {
      dragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch {}
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      cam.yaw -= e.movementX * 0.0055;
      cam.height += e.movementY * 0.02;
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      cam.back += e.deltaY * 0.012;
    }, { passive: false });

    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
    loader.setDRACOLoader(draco);
    const loadGltf = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

    function findBone(obj, re) {
      let found = null;
      obj.traverse((o) => { if (!found && o.isBone && re.test(o.name)) found = o; });
      return found;
    }
    function prep(sceneRoot) {
      sceneRoot.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of mats) { m.envMapIntensity = 0.85; m.needsUpdate = true; }
          }
        }
      });
    }
    function boneBase(name) { return String(name).replace(/^mixamorig:?/i, ''); }
    function makeBoneRename(targetRoot) {
      const names = new Set();
      targetRoot.traverse((o) => { if (o.name) names.add(o.name); });
      return (srcName) => {
        if (names.has(srcName)) return srcName;
        const base = boneBase(srcName);
        if (names.has(base)) return base;
        if (names.has('mixamorig' + base)) return 'mixamorig' + base;
        if (names.has('mixamorig:' + base)) return 'mixamorig:' + base;
        return null;
      };
    }
    function retargetClip(clip, rename) {
      const tracks = [];
      for (const t of clip.tracks) {
        const dot = t.name.lastIndexOf('.');
        if (dot < 0) continue;
        const bone = t.name.slice(0, dot);
        const prop = t.name.slice(dot + 1);
        if (prop !== 'quaternion') continue;
        if (/head$/i.test(boneBase(bone))) continue;
        if (/^hips$/i.test(boneBase(bone))) continue;
        const mapped = rename(bone);
        if (!mapped) continue;
        const nt = t.clone();
        nt.name = mapped + '.' + prop;
        tracks.push(nt);
      }
      return new THREE.AnimationClip(clip.name + '-rt', clip.duration, tracks);
    }
    function fitModel(model, height = 1.7) {
      model.position.set(0, 0, 0);
      model.rotation.set(0, 0, 0);
      model.scale.set(1, 1, 1);
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      model.scale.setScalar(height / Math.max(size.y, 0.001));
      model.updateMatrixWorld(true);
      box.setFromObject(model);
      box.getCenter(center);
      model.position.x += -center.x;
      model.position.z += -center.z;
      model.position.y += -box.min.y;
      model.updateMatrixWorld(true);
    }
    function tintClothes(model, hex) {
      const color = new THREE.Color(hex);
      model.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        if (!/outfit|top|shirt|bottom|pants|body/i.test(o.name)) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const next = mats.map((m) => {
          const c = m.clone();
          c.color = color.clone();
          return c;
        });
        o.material = Array.isArray(o.material) ? next : next[0];
      });
    }
    function wrapPi(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }
    function cacheBoneRest(bone) {
      if (!bone || bone.userData.restQuat) return;
      bone.userData.restQuat = bone.quaternion.clone();
      bone.userData.restPos = bone.position.clone();
    }
    function restoreBone(bone) {
      if (!bone?.userData.restQuat) return;
      bone.quaternion.copy(bone.userData.restQuat);
      bone.position.copy(bone.userData.restPos);
    }
    const poseQ = new THREE.Quaternion();
    const poseE = new THREE.Euler(0, 0, 0, 'XYZ');
    function overlayBone(bone, x, y, z, k) {
      if (!bone || k <= 0) return;
      if (!bone.userData.restQuat) cacheBoneRest(bone);
      bone.quaternion.copy(bone.userData.restQuat);
      poseE.set(x * k, y * k, z * k);
      poseQ.setFromEuler(poseE);
      bone.quaternion.multiply(poseQ);
    }
    function smooth(t) { t = THREE.MathUtils.clamp(t, 0, 1); return t * t * (3 - 2 * t); }

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const tmp3 = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    const wobbleQ = new THREE.Quaternion();
    const wobbleE = new THREE.Euler(0, 0, 0, 'XZY');

    const actors = [];
    const cars = [];
    let player = null;
    let soldierClips = [];

    function makeCar({ name, x, z, heading, color, mesh }) {
      const root = new THREE.Group();
      root.position.set(x, FLOOR_Y, z);
      root.rotation.y = heading;
      const wheels = [];
      let doorPivot = null;

      if (mesh) {
        prep(mesh);
        const box = new THREE.Box3().setFromObject(mesh);
        const size = new THREE.Vector3();
        box.getSize(size);
        mesh.scale.setScalar(4.4 / Math.max(size.z, size.x, 0.001));
        mesh.updateMatrixWorld(true);
        box.setFromObject(mesh);
        mesh.position.y += -box.min.y;
        root.add(mesh);
        mesh.traverse((o) => {
          if (/wheel/i.test(o.name)) wheels.push(o);
        });
      } else {
        const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.62, roughness: 0.32 });
        const dark = new THREE.MeshStandardMaterial({ color: '#171a20', metalness: 0.45, roughness: 0.48 });
        const chrome = new THREE.MeshStandardMaterial({ color: '#d8dde6', metalness: 0.9, roughness: 0.25 });
        const glass = new THREE.MeshPhysicalMaterial({
          color: '#8fb8d4', metalness: 0.1, roughness: 0.08, transmission: 0.55, transparent: true, opacity: 0.72,
        });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.5, 4.25), bodyMat);
        body.position.y = 0.4;
        body.castShadow = true;
        body.receiveShadow = true;
        root.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.48, 1.72), glass);
        cabin.position.set(0, 0.86, -0.12);
        cabin.castShadow = true;
        root.add(cabin);
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 1.15), bodyMat);
        hood.position.set(0, 0.62, 1.28);
        root.add(hood);
        const wind = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.4, 0.06), glass);
        wind.position.set(0, 0.88, 0.74);
        wind.rotation.x = -0.42;
        root.add(wind);
        const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.34, 0.06), glass);
        rearGlass.position.set(0, 0.86, -0.96);
        rearGlass.rotation.x = 0.28;
        root.add(rearGlass);
        for (const sx of [-0.72, 0.72]) {
          const light = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 0.08), new THREE.MeshStandardMaterial({ color: '#f8f1c8', emissive: '#f2e7a0', emissiveIntensity: 0.6 }));
          light.position.set(sx, 0.42, 2.14);
          root.add(light);
        }
        doorPivot = new THREE.Group();
        doorPivot.position.set(0.93, 0.52, 0.18);
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.72, 1.12), bodyMat);
        door.position.set(0.04, 0.12, 0);
        door.castShadow = true;
        doorPivot.add(door);
        const dglass = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.88), glass);
        dglass.position.set(0.04, 0.48, 0);
        doorPivot.add(dglass);
        root.add(doorPivot);
        const rightDoor = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.72, 1.12), bodyMat);
        rightDoor.position.set(-0.96, 0.64, 0.18);
        root.add(rightDoor);
        const wgeo = new THREE.CylinderGeometry(0.33, 0.33, 0.24, 18);
        wgeo.rotateZ(Math.PI / 2);
        for (const [wx, wz] of [[0.78, 1.28], [-0.78, 1.28], [0.78, -1.28], [-0.78, -1.28]]) {
          const w = new THREE.Mesh(wgeo, dark);
          w.position.set(wx, 0.33, wz);
          w.castShadow = true;
          root.add(w);
          wheels.push(w);
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.26, 12), chrome);
          rim.rotation.z = Math.PI / 2;
          rim.position.copy(w.position);
          root.add(rim);
        }
      }

      const seat = new THREE.Object3D();
      seat.position.set(0.36, 0.5, 0.16);
      root.add(seat);
      const board = new THREE.Object3D();
      board.position.set(1.55, 0, 0.2);
      root.add(board);
      scene.add(root);

      const car = {
        name, root, mesh: mesh || null, doorPivot, wheels, seat, board,
        driver: null, speed: 0, heading, color,
        doorOpen: 0,
      };
      cars.push(car);
      return car;
    }

    function attachLocomotion(actor, clips) {
      const rename = makeBoneRename(actor.model);
      actor.mixer = new THREE.AnimationMixer(actor.model);
      const walkSrc = clips.find((c) => /walk/i.test(c.name));
      const idleSrc = clips.find((c) => /idle/i.test(c.name));
      if (walkSrc) {
        actor.walkAction = actor.mixer.clipAction(retargetClip(walkSrc, rename));
        actor.walkAction.play();
        actor.walkAction.setEffectiveWeight(0);
      }
      if (idleSrc) {
        actor.idleAction = actor.mixer.clipAction(retargetClip(idleSrc, rename));
        actor.idleAction.play();
        actor.idleAction.setEffectiveWeight(1);
      }
    }
    function makeActor(model, { name, player: isPlayer, x, z, heading }) {
      const root = new THREE.Group();
      root.position.set(x, FLOOR_Y, z);
      root.add(model);
      scene.add(root);
      const bones = {
        hips: findBone(model, /hips$/i),
        spine: findBone(model, /spine$/i),
        spine1: findBone(model, /spine1$/i),
        leftUpLeg: findBone(model, /leftuple/i),
        leftLeg: findBone(model, /leftleg$/i),
        rightUpLeg: findBone(model, /rightuple/i),
        rightLeg: findBone(model, /rightleg$/i),
        leftArm: findBone(model, /leftarm$/i),
        rightArm: findBone(model, /rightarm$/i),
        leftFore: findBone(model, /leftforearm/i),
        rightFore: findBone(model, /rightforearm/i),
        leftShoulder: findBone(model, /leftshoulder/i),
        rightShoulder: findBone(model, /rightshoulder/i),
      };
      for (const b of Object.values(bones)) cacheBoneRest(b);
      const actor = {
        name, player: !!isPlayer, root, model, bones,
        mixer: null, walkAction: null, idleAction: null,
        heading: heading || 0,
        vy: 0, jumpY: 0, grounded: true, mode: 'idle',
        wobble: { x: 0, z: 0, y: 0 },
        walkPhase: 0,
        neck: findBone(model, /neck/i),
        head: findBone(model, /head$/i),
        wait: 0,
        waypoint: null,
        vehicle: null,
        board: null,
        sitK: 0,
      };
      cacheBoneRest(actor.neck);
      cacheBoneRest(actor.head);
      root.rotation.y = actor.heading + FACE_OFFSET;
      actors.push(actor);
      if (isPlayer) player = actor;
      return actor;
    }

    function applySitPose(actor, k) {
      actor.sitK = k;
      if (k <= 0.001) return;
      const b = actor.bones;
      overlayBone(b.hips, 0.04, 0, 0, k);
      overlayBone(b.spine, 0.1, 0, 0, k);
      overlayBone(b.spine1, 0.06, 0, 0, k);
      overlayBone(b.leftUpLeg, -1.48, 0.06, 0.1, k);
      overlayBone(b.leftLeg, 1.38, 0, 0, k);
      overlayBone(b.rightUpLeg, -1.48, -0.06, -0.1, k);
      overlayBone(b.rightLeg, 1.38, 0, 0, k);
      overlayBone(b.leftShoulder, 0.08, 0.12, 0.35, k);
      overlayBone(b.rightShoulder, 0.08, -0.12, -0.35, k);
      overlayBone(b.leftArm, -0.35, 0.12, 0.55, k);
      overlayBone(b.rightArm, -0.35, -0.12, -0.55, k);
      overlayBone(b.leftFore, -0.55, 0, 0.18, k);
      overlayBone(b.rightFore, -0.55, 0, -0.18, k);
    }

    function carDoorWorld(car, out) {
      car.board.getWorldPosition(out);
      out.y = FLOOR_Y;
      return out;
    }
    function carSeatWorld(car, out) {
      car.seat.getWorldPosition(out);
      out.y -= SIT_DROP;
      return out;
    }
    function nearestOpenCar(actor, maxDist) {
      let best = null, bestD = maxDist;
      for (const car of cars) {
        if (car.driver && car.driver !== actor) continue;
        carDoorWorld(car, tmp);
        const d = tmp.distanceTo(actor.root.position);
        if (d < bestD) { best = car; bestD = d; }
      }
      return best;
    }
    function setDoor(car, open01) {
      car.doorOpen = THREE.MathUtils.clamp(open01, 0, 1);
      if (car.doorPivot) car.doorPivot.rotation.y = -DOOR_ANGLE * car.doorOpen;
    }
    function seatInCar(actor, car) {
      car.driver = actor;
      actor.vehicle = car;
      car.seat.attach(actor.root);
      actor.root.position.set(0, -SIT_DROP, 0);
      actor.root.rotation.set(0, FACE_OFFSET, 0);
      actor.heading = car.heading;
      actor.mode = 'seated';
      actor.jumpY = 0;
      actor.sitK = 1;
      setDoor(car, 0);
    }
    function standByDoor(actor, car) {
      carDoorWorld(car, tmp);
      scene.attach(actor.root);
      actor.root.position.copy(tmp);
      actor.root.position.y = FLOOR_Y;
      actor.vehicle = null;
      if (car.driver === actor) car.driver = null;
      actor.mode = 'idle';
      actor.sitK = 0;
      actor.jumpY = FLOOR_Y;
      actor.root.rotation.set(0, actor.heading + FACE_OFFSET, 0);
    }
    function startEnter(actor, car) {
      if (!car || (car.driver && car.driver !== actor)) return;
      car.driver = actor;
      actor.board = { car, kind: 'enter', t: 0, phase: 'walk' };
      actor.mode = 'enter';
      actor.waypoint = null;
    }
    function startExit(actor) {
      const car = actor.vehicle;
      if (!car) return;
      scene.attach(actor.root);
      carSeatWorld(car, tmp);
      actor.root.position.copy(tmp);
      actor.heading = car.heading;
      actor.root.rotation.y = actor.heading + FACE_OFFSET;
      actor.vehicle = null;
      car.driver = null;
      actor.board = { car, kind: 'exit', t: 0, phase: 'motion' };
      actor.mode = 'exit';
      actor.sitK = 1;
      setDoor(car, 0);
    }
    function tryEnterExit(actor) {
      if (actor.mode === 'enter' || actor.mode === 'exit') return;
      if (actor.vehicle) {
        if (Math.abs(actor.vehicle.speed) > 2.2) return;
        startExit(actor);
        return;
      }
      const car = nearestOpenCar(actor, 4.4);
      if (car) startEnter(actor, car);
    }

    function stepBoard(actor, dt) {
      const job = actor.board;
      if (!job) return;
      const car = job.car;
      carDoorWorld(car, tmp);
      carSeatWorld(car, tmp2);
      if (job.kind === 'enter' && job.phase === 'walk') {
        tmp3.copy(tmp).sub(actor.root.position);
        tmp3.y = 0;
        const dist = tmp3.length();
        if (dist > 0.38) {
          tmp3.normalize();
          actor.heading += wrapPi(Math.atan2(tmp3.x, tmp3.z) - actor.heading) * Math.min(1, TURN_SPEED * dt);
          actor.root.position.x += Math.sin(actor.heading) * WALK_SPEED * dt;
          actor.root.position.z += Math.cos(actor.heading) * WALK_SPEED * dt;
          actor.root.rotation.y = actor.heading + FACE_OFFSET;
          actor.mode = 'enter';
          return;
        }
        job.phase = 'motion';
        job.t = 0;
      }
      job.t += dt;
      const dur = job.kind === 'enter' ? ENTER_TIME : EXIT_TIME;
      const u = THREE.MathUtils.clamp(job.t / dur, 0, 1);
      if (job.kind === 'enter') {
        const face = Math.atan2(tmp2.x - tmp.x, tmp2.z - tmp.z);
        actor.heading += wrapPi(face - actor.heading) * Math.min(1, 4 * dt);
        const doorT = smooth(THREE.MathUtils.clamp((u - 0.05) / 0.22, 0, 1));
        const sitT = smooth(THREE.MathUtils.clamp((u - 0.28) / 0.42, 0, 1));
        const closeT = smooth(THREE.MathUtils.clamp((u - 0.78) / 0.2, 0, 1));
        setDoor(car, Math.max(doorT * (1 - closeT), u < 0.82 ? doorT : 1 - closeT));
        actor.root.position.lerpVectors(tmp, tmp2, sitT);
        actor.root.position.y = THREE.MathUtils.lerp(FLOOR_Y, tmp2.y, sitT);
        actor.root.rotation.y = actor.heading + FACE_OFFSET;
        applySitPose(actor, sitT);
        overlayBone(actor.bones.rightArm, -1.1, -0.2, -0.9, (1 - sitT) * doorT);
        if (u >= 1) {
          seatInCar(actor, car);
          actor.board = null;
        }
      } else {
        const sitT = 1 - smooth(THREE.MathUtils.clamp(u / 0.45, 0, 1));
        const doorT = smooth(THREE.MathUtils.clamp((u - 0.05) / 0.2, 0, 1));
        const closeT = smooth(THREE.MathUtils.clamp((u - 0.78) / 0.2, 0, 1));
        const slide = smooth(THREE.MathUtils.clamp((u - 0.12) / 0.5, 0, 1));
        setDoor(car, doorT * (1 - closeT));
        actor.root.position.lerpVectors(tmp2, tmp, slide);
        actor.root.position.y = THREE.MathUtils.lerp(tmp2.y, FLOOR_Y, slide);
        const outFace = Math.atan2(tmp.x - tmp2.x, tmp.z - tmp2.z);
        actor.heading += wrapPi(outFace - actor.heading) * Math.min(1, 3 * dt);
        actor.root.rotation.y = actor.heading + FACE_OFFSET;
        applySitPose(actor, sitT);
        overlayBone(actor.bones.leftArm, -0.9, 0.2, 0.7, doorT * (1 - closeT) * 0.8);
        if (u >= 1) {
          standByDoor(actor, car);
          setDoor(car, 0);
          actor.board = null;
        }
      }
    }

    function driveCar(car, dt, throttle, steer) {
      const accel = 11 * throttle;
      car.speed += accel * dt;
      car.speed *= Math.exp(-1.6 * dt);
      if (Math.abs(throttle) < 0.05) car.speed *= Math.exp(-1.1 * dt);
      car.speed = THREE.MathUtils.clamp(car.speed, -6, 14);
      const turn = steer * dt * (1.8 + Math.abs(car.speed) * 0.22) * Math.sign(car.speed || 1);
      if (Math.abs(car.speed) > 0.15) car.heading += turn;
      car.root.position.x += Math.sin(car.heading) * car.speed * dt;
      car.root.position.z += Math.cos(car.heading) * car.speed * dt;
      car.root.rotation.y = car.heading;
      const spin = car.speed * dt * 2.4;
      for (const w of car.wheels) w.rotation.x += spin;
    }

    function pickWaypoint(actor) {
      const a = Math.random() * Math.PI * 2;
      const r = 3 + Math.random() * 8;
      actor.waypoint = new THREE.Vector3(Math.sin(a) * r, FLOOR_Y, Math.cos(a) * r);
      actor.wait = 0;
    }
    function setState(name, label) {
      stateEl.textContent = label || name;
      stateEl.className = name === 'tripped' ? 'trip' : name === 'air' ? 'air' : (name === 'seated' || name === 'enter' || name === 'exit') ? 'drive' : '';
      stateEl.id = 'state';
    }

    function steerToward(actor, wish, dt) {
      const moving = wish.lengthSq() > 1e-6;
      if (moving) {
        const target = Math.atan2(wish.x, wish.z);
        const delta = wrapPi(target - actor.heading);
        const maxTurn = TURN_SPEED * dt;
        actor.heading += THREE.MathUtils.clamp(delta, -maxTurn, maxTurn);
        const turn = Math.min(1, Math.abs(delta) / 1.35);
        const speed = WALK_SPEED * (1 - 0.7 * turn);
        actor.root.position.x += Math.sin(actor.heading) * speed * dt;
        actor.root.position.z += Math.cos(actor.heading) * speed * dt;
      }
      actor.root.rotation.y = actor.heading + FACE_OFFSET;
      return moving;
    }

    function stepActor(actor, dt, params) {
      const { amp, size, hz } = params;
      if (actor.mode === 'enter' || actor.mode === 'exit') {
        if (actor.walkAction && actor.idleAction) {
          const approaching = actor.board?.phase === 'walk';
          actor.walkAction.setEffectiveWeight(approaching ? 1 : 0);
          actor.idleAction.setEffectiveWeight(approaching ? 0 : 1);
        }
        actor.mixer?.update(dt);
        restoreBone(actor.head);
        if (actor.head) actor.head.scale.setScalar(size);
        stepBoard(actor, dt);
        actor.wobble.x = actor.wobble.z = actor.wobble.y = 0;
        return;
      }
      if (actor.mode === 'seated' && actor.vehicle) {
        let throttle = 0, steer = 0;
        if (actor.player) {
          if (keys.KeyW || keys.ArrowUp) throttle += 1;
          if (keys.KeyS || keys.ArrowDown) throttle -= 1;
          if (keys.KeyA || keys.ArrowLeft) steer += 1;
          if (keys.KeyD || keys.ArrowRight) steer -= 1;
        } else {
          throttle = 0.35;
          steer = Math.sin(performance.now() * 0.0004 + actor.heading) * 0.45;
        }
        driveCar(actor.vehicle, dt, throttle, steer);
        actor.heading = actor.vehicle.heading;
        if (actor.walkAction && actor.idleAction) {
          actor.walkAction.setEffectiveWeight(0);
          actor.idleAction.setEffectiveWeight(0.2);
        }
        actor.mixer?.update(dt * 0.4);
        restoreBone(actor.head);
        if (actor.head) actor.head.scale.setScalar(size);
        applySitPose(actor, 1);
        actor.wobble.x = actor.wobble.z = actor.wobble.y = 0;
        return;
      }

      let wishX = 0, wishZ = 0;
      if (actor.player) {
        let ix = 0, iz = 0;
        if (keys.KeyW || keys.ArrowUp) iz -= 1;
        if (keys.KeyS || keys.ArrowDown) iz += 1;
        if (keys.KeyA || keys.ArrowLeft) ix -= 1;
        if (keys.KeyD || keys.ArrowRight) ix += 1;
        if (ix || iz) {
          const len = Math.hypot(ix, iz);
          const f = -iz / len;
          const r = ix / len;
          wishX = Math.sin(cam.yaw) * f + Math.cos(cam.yaw) * r;
          wishZ = Math.cos(cam.yaw) * f - Math.sin(cam.yaw) * r;
        }
        if (actor.grounded && keys.Space) { actor.vy = 5.1; actor.grounded = false; }
      } else {
        if (actor.wait > 0) {
          actor.wait -= dt;
        } else if (!actor.waypoint && Math.random() < 0.0009) {
          const car = nearestOpenCar(actor, 14);
          if (car && !car.driver) startEnter(actor, car);
        } else {
          if (!actor.waypoint) pickWaypoint(actor);
          tmp.set(actor.waypoint.x - actor.root.position.x, 0, actor.waypoint.z - actor.root.position.z);
          if (tmp.length() < 0.55) {
            actor.waypoint = null;
            actor.wait = 0.5 + Math.random() * 1.6;
          } else {
            tmp.normalize();
            wishX = tmp.x; wishZ = tmp.z;
          }
        }
      }
      actor.vy -= 14 * dt;
      actor.jumpY += actor.vy * dt;
      if (actor.jumpY <= FLOOR_Y) { actor.jumpY = FLOOR_Y; actor.vy = 0; actor.grounded = true; }
      actor.root.position.y = actor.jumpY;
      tmp.set(wishX, 0, wishZ);
      const walking = steerToward(actor, tmp, dt) && actor.grounded;
      if (!actor.grounded) actor.mode = 'air';
      else if (walking) actor.mode = 'walk';
      else actor.mode = 'idle';

      if (actor.walkAction && actor.idleAction) {
        const w = actor.mode === 'walk' ? 1 : 0;
        actor.walkAction.setEffectiveWeight(w);
        actor.idleAction.setEffectiveWeight(1 - w);
      }
      actor.mixer?.update(dt);
      restoreBone(actor.head);
      if (actor.head) actor.head.scale.setScalar(size);

      if (actor.mode === 'walk') {
        actor.walkPhase += dt * Math.PI * 2 * hz;
        const n = 0.22 + amp * 0.07;
        actor.wobble.x = Math.sin(actor.walkPhase) * THREE.MathUtils.degToRad(5 * n);
        actor.wobble.z = Math.cos(actor.walkPhase) * THREE.MathUtils.degToRad(2.4 * n);
        actor.wobble.y = Math.abs(Math.sin(actor.walkPhase)) * 0.01 * n;
      } else {
        actor.walkPhase = 0;
        actor.wobble.x = 0;
        actor.wobble.z = 0;
        actor.wobble.y = 0;
      }
      wobbleE.set(actor.wobble.x, 0, actor.wobble.z);
      wobbleQ.setFromEuler(wobbleE);
      if (actor.head && actor.mode === 'walk') {
        actor.head.quaternion.multiply(wobbleQ);
        actor.head.position.y += actor.wobble.y;
      }
    }

    document.getElementById('reset').onclick = () => {
      if (!player) return;
      if (player.vehicle) standByDoor(player, player.vehicle);
      if (player.board?.car && player.board.car.driver === player) player.board.car.driver = null;
      player.board = null;
      if (player.root.parent !== scene) scene.attach(player.root);
      player.root.position.set(0, FLOOR_Y, 0);
      player.heading = 0;
      player.root.rotation.set(0, FACE_OFFSET, 0);
      player.jumpY = FLOOR_Y; player.vy = 0; player.grounded = true; player.mode = 'idle';
      player.wobble.x = player.wobble.z = player.wobble.y = 0;
      cam.yaw = 0;
      followTarget(0, 0, 0, 0, false);
    };

    function resize() {
      const w = Math.max(1, canvas.clientWidth || innerWidth);
      const h = Math.max(1, canvas.clientHeight || innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe(canvas);
    resize();

    try {
      const people = await Promise.all([
        loadGltf(URLS.rpm),
        loadGltf(URLS.michelle),
        loadGltf(URLS.soldier),
      ]);
      const [rpmG, michG, soldG] = people;
      soldierClips = soldG.animations || [];
      prep(rpmG.scene); fitModel(rpmG.scene);
      prep(michG.scene); fitModel(michG.scene);
      prep(soldG.scene); fitModel(soldG.scene);
      const friend = cloneSkinned(rpmG.scene);
      tintClothes(friend, '#355e3b');

      makeCar({ name: 'red', x: 0.15, z: 3.6, heading: 0.05, color: '#c62828' });
      makeCar({ name: 'yellow', x: -6.2, z: 1.8, heading: -1.1, color: '#f4c430' });
      makeCar({ name: 'blue', x: 5.8, z: 5.2, heading: 2.5, color: '#1d4e89' });
      try {
        const fer = await loadGltf(URLS.ferrari);
        makeCar({ name: 'ferrari', x: -4.8, z: -6.2, heading: 0.2, color: '#d40000', mesh: fer.scene });
      } catch {
        makeCar({ name: 'black', x: -4.8, z: -6.2, heading: 0.2, color: '#22262e' });
      }

      makeActor(rpmG.scene, { name: 'suit', player: true, x: 0, z: 0, heading: 0 });
      const woman = makeActor(michG.scene, { name: 'michelle', x: 2.4, z: -1.6, heading: 1.2 });
      const guard = makeActor(soldG.scene, { name: 'soldier', x: -2.6, z: -1.1, heading: -0.8 });
      const pal = makeActor(friend, { name: 'green', x: 1.6, z: 2.2, heading: 2.5 });
      for (const a of actors) attachLocomotion(a, soldierClips);
      pickWaypoint(woman); pickWaypoint(guard); pickWaypoint(pal);
      followTarget(0, 0, 0, 0, false);
      loadEl.remove();
      canvas.focus();
    } catch (err) {
      loadEl.textContent = 'Could not load scene: ' + err.message;
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 30);
      const params = {
        hz: Number(sliders.hz.value),
        amp: Number(sliders.amp.value),
        size: Number(sliders.size.value),
      };
      for (const a of actors) stepActor(a, dt, params);

      let prompt = '';
      if (player) {
        if (player.mode === 'seated') {
          setState('seated', Math.abs(player.vehicle?.speed || 0) > 0.4 ? 'Driving' : 'In car');
          prompt = Math.abs(player.vehicle?.speed || 0) < 2.2 ? 'Press E to get out' : '';
          const p = player.vehicle.root.position;
          followTarget(p.x, p.y, p.z, player.vehicle.heading, true);
          cam.yaw = player.vehicle.heading;
        } else if (player.mode === 'enter') {
          setState('enter', 'Getting in');
          followTarget(player.root.position.x, player.root.position.y, player.root.position.z, player.heading, false);
        } else if (player.mode === 'exit') {
          setState('exit', 'Getting out');
          followTarget(player.root.position.x, player.root.position.y, player.root.position.z, player.heading, false);
        } else {
          setState(player.mode, player.mode === 'walk' ? 'Walk' : player.mode === 'air' ? 'Jump' : 'Idle');
          const near = nearestOpenCar(player, 4.4);
          prompt = near ? 'Press E to get in' : '';
          followTarget(player.root.position.x, player.root.position.y, player.root.position.z, player.heading, false);
        }
      }
      promptEl.style.display = prompt ? 'block' : 'none';
      promptEl.textContent = prompt;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
